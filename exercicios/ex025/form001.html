<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1> 
    <!-- action -> o arquivo pra onde vai as info 
        autocomplete -> se sugere dados automáticos
        method -> get ou post 

        get -> quando o usuário clica em enviar e a url aparece os dados logo acima, por exemplo: cadastro.php?nome=wallisson
        post -> contrário ao get, não mostra o atributo e valor na url, exemplo: cadastro.php?
    -->
    <form action="cadastro.php" method="POST" autocomplete="off">
        <p> 
            <label for="inome">Nome:</label> <input type="text" name="nome" id="inome">
        </p>
        <p>
            <label for="isobrenome">Sobrenome:</label> <input type="text" name="sobrenome" id="isobrenome">
        </p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
